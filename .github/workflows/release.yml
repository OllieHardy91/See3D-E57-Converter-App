name: Build Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Generate premium multi-size .ico
        run: |
          # Wordmark at 64/128/256, '3D' monogram at 16/32/48 - matches
          # the macOS sibling app and Apple's own pro-app icon pattern.
          python scripts/generate_icon_source.py

      - name: Build EXE
        run: |
          python -m PyInstaller --onefile --windowed --noconfirm --noupx `
            --name "See3D_E57_Converter" `
            --icon "assets/app_icon.ico" `
            --add-data "assets;assets" `
            --hidden-import numpy `
            --hidden-import scipy `
            --hidden-import scipy.spatial `
            --hidden-import scipy.spatial.transform `
            --hidden-import scipy.spatial.transform._rotation_groups `
            --hidden-import cv2 `
            --hidden-import pye57 `
            --hidden-import tqdm `
            --hidden-import tqdm.auto `
            --hidden-import PIL `
            --hidden-import PIL.Image `
            --hidden-import customtkinter `
            --hidden-import tkinterdnd2 `
            --collect-data customtkinter `
            --collect-data tkinterdnd2 `
            --collect-data cv2 `
            --collect-binaries cv2 `
            --collect-binaries pye57 `
            --exclude-module torch `
            --exclude-module torchvision `
            --exclude-module torchaudio `
            --exclude-module tensorflow `
            --exclude-module jax `
            --exclude-module matplotlib `
            --exclude-module IPython `
            --exclude-module sklearn `
            --exclude-module pandas `
            --exclude-module pytest `
            --exclude-module notebook `
            app.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: See3D_E57_Converter-windows
          path: dist/See3D_E57_Converter.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/See3D_E57_Converter.exe
          fail_on_unmatched_files: true
          generate_release_notes: true

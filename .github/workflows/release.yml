name: Build Windows EXE + macOS .app

on:
  push:
    tags:
      - "v*"
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Build app_icon.ico from Final_Icon.png
        run: |
          python -c "from PIL import Image; img = Image.open('assets/Final_Icon.png').convert('RGBA'); img.save('assets/app_icon.ico', format='ICO', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Build EXE
        run: |
          python -m PyInstaller --onefile --windowed --noconfirm --noupx `
            --name "See3D_E57_Converter" `
            --icon "assets/app_icon.ico" `
            --add-data "assets;assets" `
            --hidden-import numpy `
            --hidden-import scipy `
            --hidden-import scipy.spatial `
            --hidden-import scipy.spatial.transform `
            --hidden-import scipy.spatial.transform._rotation_groups `
            --hidden-import cv2 `
            --hidden-import pye57 `
            --hidden-import tqdm `
            --hidden-import tqdm.auto `
            --hidden-import PIL `
            --hidden-import PIL.Image `
            --hidden-import customtkinter `
            --hidden-import tkinterdnd2 `
            --collect-data customtkinter `
            --collect-data tkinterdnd2 `
            --collect-binaries tkinterdnd2 `
            --collect-data cv2 `
            --collect-binaries cv2 `
            --collect-binaries pye57 `
            --exclude-module torch `
            --exclude-module torchvision `
            --exclude-module torchaudio `
            --exclude-module tensorflow `
            --exclude-module jax `
            --exclude-module matplotlib `
            --exclude-module IPython `
            --exclude-module sklearn `
            --exclude-module pandas `
            --exclude-module pytest `
            --exclude-module notebook `
            app.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: See3D_E57_Converter-windows
          path: dist/See3D_E57_Converter.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/See3D_E57_Converter.exe
          fail_on_unmatched_files: true
          generate_release_notes: true

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Build app_icon.icns from Final_Icon.png
        run: |
          mkdir -p build/app_icon.iconset
          for sz in 16 32 64 128 256 512; do
            sips -z $sz $sz assets/Final_Icon.png \
              --out "build/app_icon.iconset/icon_${sz}x${sz}.png" >/dev/null
            sips -z $((sz*2)) $((sz*2)) assets/Final_Icon.png \
              --out "build/app_icon.iconset/icon_${sz}x${sz}@2x.png" >/dev/null
          done
          iconutil -c icns -o assets/app_icon.icns build/app_icon.iconset

      - name: Build .app with PyInstaller
        run: |
          python -m PyInstaller --windowed --noconfirm --noupx \
            --name "See3D_E57_Converter" \
            --icon "assets/app_icon.icns" \
            --add-data "assets:assets" \
            --hidden-import numpy \
            --hidden-import scipy \
            --hidden-import scipy.spatial \
            --hidden-import scipy.spatial.transform \
            --hidden-import scipy.spatial.transform._rotation_groups \
            --hidden-import cv2 \
            --hidden-import pye57 \
            --hidden-import tqdm \
            --hidden-import tqdm.auto \
            --hidden-import PIL \
            --hidden-import PIL.Image \
            --hidden-import customtkinter \
            --hidden-import tkinterdnd2 \
            --collect-data customtkinter \
            --collect-data tkinterdnd2 \
            --collect-binaries tkinterdnd2 \
            --collect-data cv2 \
            --collect-binaries cv2 \
            --collect-binaries pye57 \
            --exclude-module torch \
            --exclude-module torchvision \
            --exclude-module torchaudio \
            --exclude-module tensorflow \
            --exclude-module jax \
            --exclude-module matplotlib \
            --exclude-module IPython \
            --exclude-module sklearn \
            --exclude-module pandas \
            --exclude-module pytest \
            --exclude-module notebook \
            app.py

      - name: Zip .app for upload
        working-directory: dist
        run: zip -r See3D_E57_Converter-mac.zip See3D_E57_Converter.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: See3D_E57_Converter-macos
          path: dist/See3D_E57_Converter-mac.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/See3D_E57_Converter-mac.zip
          fail_on_unmatched_files: true
